Password.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password - Taskora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 30px 25px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.10);
      border: 1px solid #eaecf0;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-name {
      font-size: 30px;
      font-weight: bold;
      color: #6d28d9;
      margin-bottom: 6px;
    }

    .logo-text {
      color: #667085;
      font-size: 13px;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #ede9fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
    }

    h1 {
      text-align: center;
      margin: 0 0 9px;
      font-size: 24px;
      color: #172033;
    }

    .intro {
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 25px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #344054;
      margin-bottom: 7px;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 13px 45px 13px 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.10);
    }

    .toggle-password {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      padding: 5px;
    }

    .password-hint {
      margin-top: 6px;
      color: #667085;
      font-size: 11px;
      line-height: 1.4;
    }

    .button {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      padding: 14px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .button:hover {
      opacity: 0.95;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .message.success {
      background: #ecfdf3;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .back-login {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6d28d9;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #98a2b3;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 27px 20px;
      }

      .logo-name {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">

        <div class="logo-name">
          Taskora
        </div>

        <div class="logo-text">
          Simple tasks. Real rewards.
        </div>

      </div>


      <div class="icon">
        🔐
      </div>


      <h1>
        Create a New Password
      </h1>


      <p class="intro">
        Choose a new password for your Taskora account.
      </p>


      <div
        id="message"
        class="message"
      ></div>


      <form id="resetForm">

        <div class="form-group">

          <label for="password">
            New Password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              placeholder="Enter your new password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
            >
              👁️
            </button>

          </div>

          <div class="password-hint">
            Use at least 6 characters.
          </div>

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm New Password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="confirmPassword"
              placeholder="Re-enter your new password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="toggleConfirmPassword"
            >
              👁️
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="button"
          id="resetButton"
        >
          Update Password
        </button>

      </form>


      <a
        href="./login.html"
        class="back-login"
      >
        ← Back to Login
      </a>

    </div>


    <div class="footer">
      © 2026 Taskora. All rights reserved.
    </div>

  </div>


  <script type="module">

    import { supabase } from "./js/supabase.js";


    const resetForm =
      document.getElementById("resetForm");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const resetButton =
      document.getElementById("resetButton");

    const message =
      document.getElementById("message");


    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        `message show ${type}`;

    }


    function hideMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    function setupPasswordToggle(
      input,
      button
    ) {

      button.addEventListener(
        "click",
        () => {

          if (
            input.type === "password"
          ) {

            input.type = "text";

            button.textContent = "🙈";

          } else {

            input.type = "password";

            button.textContent = "👁️";

          }

        }
      );

    }


    setupPasswordToggle(
      passwordInput,
      document.getElementById(
        "togglePassword"
      )
    );


    setupPasswordToggle(
      confirmPasswordInput,
      document.getElementById(
        "toggleConfirmPassword"
      )
    );


    async function checkRecoverySession() {

      const {
        data,
        error
      } =
        await supabase.auth.getSession();


      if (error) {

        console.error(
          "Session error:",
          error
        );

        showMessage(
          "This password reset link is invalid or has expired. Please request a new password reset email.",
          "error"
        );

        resetButton.disabled = true;

        return false;

      }


      if (!data?.session) {

        showMessage(
          "This password reset link is invalid or has expired. Please request a new password reset email.",
          "error"
        );

        resetButton.disabled = true;

        return false;

      }


      return true;

    }


    supabase.auth.onAuthStateChange(
      async (event) => {

        console.log(
          "Auth event:",
          event
        );

      }
    );


    resetForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideMessage();


        const password =
          passwordInput.value.trim();

        const confirmPassword =
          confirmPasswordInput.value.trim();


        if (password.length < 6) {

          showMessage(
            "Your new password must be at least 6 characters long.",
            "error"
          );

          return;

        }


        if (
          password !== confirmPassword
        ) {

          showMessage(
            "The passwords do not match.",
            "error"
          );

          return;

        }


        resetButton.disabled = true;

        resetButton.textContent =
          "Updating Password...";


        const {
          error
        } =
          await supabase.auth.updateUser({
            password: password
          });


        if (error) {

          console.error(
            "Password update error:",
            error
          );

          showMessage(
            error.message ||
            "Unable to update your password. Please try again.",
            "error"
          );

          resetButton.disabled = false;

          resetButton.textContent =
            "Update Password";

          return;

        }


        showMessage(
          "Your password has been updated successfully. You can now log in with your new password.",
          "success"
        );


        resetForm.reset();

        resetButton.textContent =
          "Password Updated";


        setTimeout(
          () => {

            window.location.href =
              "./login.html";

          },
          2500
        );

      }
    );


    checkRecoverySession();

  </script>

</body>
</html>
