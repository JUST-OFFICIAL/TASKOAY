<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Task~oay</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #5b21b6, #7c3aed, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      color: white;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .tagline {
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 25px;
      font-size: 15px;
    }

    .login-card {
      background: white;
      border-radius: 22px;
      padding: 30px 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .login-card h2 {
      text-align: center;
      color: #222;
      margin-bottom: 8px;
      font-size: 27px;
    }

    .welcome {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .forgot a {
      color: #6d28d9;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(90deg, #7c3aed, #16a34a);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      color: #666;
      font-size: 14px;
    }

    .register-link a {
      color: #6d28d9;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      text-align: center;
      margin-top: 18px;
    }

    .back-home a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">Task~oay</div>

    <div class="tagline">
      Complete tasks. Earn rewards.
    </div>

    <div class="login-card">

      <h2>Welcome Back 👋</h2>

      <p class="welcome">
        Login to your Task~oay account
      </p>

      <div id="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="forgot">
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" id="loginButton">
          Login
        </button>

      </form>

      <div class="register-link">
        Don't have an account?
        <a href="./register.html">Create Account</a>
      </div>

    </div>

    <div class="back-home">
      <a href="./index.html">← Back to Home</a>
    </div>

  </div>

  <script type="module">
    import { supabase } from "./js/supabase.js";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.display = "block";

      if (success) {
        message.style.background = "#dcfce7";
        message.style.color = "#166534";
      } else {
        message.style.background = "#fee2e2";
        message.style.color = "#991b1b";
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Logging in...";

      message.style.display = "none";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          showMessage(error.message);
          button.disabled = false;
          button.textContent = "Login";
          return;
        }

        showMessage("Login successful! Redirecting...", true);

        setTimeout(() => {
          window.location.href = "./start.html";
        }, 1000);

      } catch (err) {
        console.error(err);
        showMessage("Something went wrong. Please try again.");
        button.disabled = false;
        button.textContent = "Login";
      }
    });

    document.getElementById("forgotPassword").addEventListener("click", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Please enter your email address first.");
        return;
      }

      const { error } = 
        await
      supabase.auth.resetPasswordForEmail
      (
        email,
        {
          redirectTo:
          `$
          {window.location.origin}/reset-password.html`
        }
      );

      if (error) {
        showMessage(error.message);
        return;
      }

      showMessage("Password reset email sent. Check your inbox.", true);
    });
  </script>

</body>
</html>
